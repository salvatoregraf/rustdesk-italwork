name: Build ItalworkSupport Windows x64

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  RUST_VERSION: "1.75"
  LLVM_VERSION: "15.0.6"
  FLUTTER_VERSION: "3.24.5"
  VCPKG_COMMIT_ID: "9e593bb18ea69cc5095e012465dcd675a822ed0d"
  VCPKG_BINARY_SOURCES: "clear;x-gha,readwrite"

jobs:
  generate-bridge:
    uses: ./.github/workflows/bridge.yml

  build-topmost-window:
    uses: ./.github/workflows/third-party-RustDeskTempTopMostWindow.yml
    with:
      upload-artifact: true
      target: windows-2022
      configuration: Release
      platform: x64
      target_version: Windows10

  build-windows-x64:
    needs:
      - generate-bridge
      - build-topmost-window
    runs-on: windows-2022
    timeout-minutes: 180

    steps:
      - name: Checkout modified OSS source
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          submodules: recursive
          persist-credentials: false

      - name: Restore generated Rust/Flutter bridge
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: bridge-artifact
          path: ./

      - name: Validate Italwork defaults
        shell: pwsh
        run: |
          $config = Get-Content .\src\common.rs -Raw
          foreach ($required in @(
            'const APP_NAME: &str = "ItalworkSupport";',
            '*config::APP_NAME.write().unwrap() = APP_NAME.to_owned();',
            'italwork.ns0.it',
            'mL9KVLSCi2I2B8zJlCokFEkG9dS2TLs3xDTM1wPqu8Y='
          )) {
            if (-not $config.Contains($required)) {
              throw "Missing expected Italwork value: $required"
            }
          }
          $runner = Get-Content .\flutter\windows\runner\main.cpp -Raw
          if (-not $runner.Contains('std::wstring app_name = L"ItalworkSupport";')) {
            throw 'Windows runner fallback name is not ItalworkSupport'
          }
          $installer = Get-Content .\src\platform\windows.rs -Raw
          foreach ($required in @(
            'reg add {subkey} /f /v DisplayName /t REG_SZ /d \"{app_name}\"',
            'format!("{}\\{}", pf, crate::get_app_name())'
          )) {
            if (-not $installer.Contains($required)) {
              throw "Windows installer no longer derives branding from the application name: $required"
            }
          }

      - name: Install LLVM and Clang
        uses: KyleMayes/install-llvm-action@ebc0426251bc40c7cd31162802432c68818ab8f0 # v2.0.9
        with:
          version: ${{ env.LLVM_VERSION }}

      - name: Install Flutter
        uses: subosito/flutter-action@2783a3f08e1baf891508463f8c6653c258246225 # v2.12.0
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          architecture: x64

      - name: Replace Flutter engine with RustDesk Windows engine
        shell: pwsh
        run: |
          flutter doctor -v
          flutter precache --windows
          Invoke-WebRequest `
            -Uri https://github.com/rustdesk/engine/releases/download/main/windows-x64-release.zip `
            -OutFile windows-x64-release.zip
          Expand-Archive windows-x64-release.zip -DestinationPath windows-x64-release
          Move-Item -Force windows-x64-release\* `
            C:\hostedtoolcache\windows\flutter\stable-${{ env.FLUTTER_VERSION }}-x64\bin\cache\artifacts\engine\windows-x64-release\

      - name: Apply required Flutter patch
        shell: bash
        run: |
          flutter_root="$(dirname "$(dirname "$(which flutter)")")"
          cp .github/patches/flutter_3.24.4_dropdown_menu_enableFilter.diff "$flutter_root/"
          cd "$flutter_root"
          git apply flutter_3.24.4_dropdown_menu_enableFilter.diff

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9 # v1
        with:
          toolchain: ${{ env.RUST_VERSION }}
          targets: x86_64-pc-windows-msvc
          components: rustfmt

      - name: Cache Rust build
        uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          prefix-key: italwork-windows-x64

      - name: Setup vcpkg
        uses: lukka/run-vcpkg@b1a0dd252f06b9e25b3c022a9a03bd7a427fb6a2 # v11
        with:
          vcpkgDirectory: C:\vcpkg
          vcpkgGitCommitId: ${{ env.VCPKG_COMMIT_ID }}
          doNotCache: false

      - name: Install native dependencies
        shell: bash
        env:
          VCPKG_DEFAULT_HOST_TRIPLET: x64-windows-static
        run: |
          "$VCPKG_ROOT/vcpkg" install \
            --triplet x64-windows-static \
            --x-install-root="$VCPKG_ROOT/installed"

      - name: Build RustDesk Flutter client
        shell: pwsh
        run: |
          python .\build.py --portable --flutter --skip-portable-pack --hwcodec --vram
          Move-Item .\flutter\build\windows\x64\runner\Release .\rustdesk

      - name: Add virtual display support
        shell: pwsh
        run: |
          Invoke-WebRequest `
            -Uri https://github.com/rustdesk-org/rdev/releases/download/usbmmidd_v2/usbmmidd_v2.zip `
            -OutFile usbmmidd_v2.zip
          Expand-Archive usbmmidd_v2.zip -DestinationPath .
          Remove-Item usbmmidd_v2\Win32 -Recurse
          Remove-Item usbmmidd_v2\deviceinstaller64.exe,usbmmidd_v2\deviceinstaller.exe,usbmmidd_v2\usbmmidd.bat
          Move-Item -Force .\usbmmidd_v2 .\rustdesk

      - name: Add topmost-window component
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: topmostwindow-artifacts-x64
          path: ./rustdesk

      - name: Build single portable executable
        shell: bash
        run: |
          sed -i '/dpiAware/d' res/manifest.xml
          pushd libs/portable
          python -m pip install -r requirements.txt
          python ./generate.py -f ../../rustdesk/ -o . -e ../../rustdesk/rustdesk.exe
          popd
          mkdir -p dist
          mv target/release/rustdesk-portable-packer.exe dist/ItalworkSupport.exe

      - name: Verify executable and checksum
        shell: pwsh
        run: |
          $version = (& .\dist\ItalworkSupport.exe --version | Out-String).Trim()
          if ($LASTEXITCODE -ne 0 -or -not $version) {
            throw "ItalworkSupport.exe version check failed with exit code $LASTEXITCODE"
          }
          $versionInfo = (Get-Item .\dist\ItalworkSupport.exe).VersionInfo
          $expectedMetadata = @{
            ProductName = 'Italwork Support'
            FileDescription = 'Italwork Support'
            CompanyName = 'Italwork S.r.l.'
            LegalCopyright = '© 2026 Italwork S.r.l. Modifiche e branding. RustDesk OSS © rispettivi autori.'
            OriginalFilename = 'ItalworkSupport.exe'
          }
          foreach ($entry in $expectedMetadata.GetEnumerator()) {
            $actual = $versionInfo.($entry.Key)
            if ($actual -ne $entry.Value) {
              throw "Invalid $($entry.Key): expected '$($entry.Value)', got '$actual'"
            }
          }
          $hash = (Get-FileHash .\dist\ItalworkSupport.exe -Algorithm SHA256).Hash.ToLowerInvariant()
          Set-Content .\dist\ItalworkSupport.exe.sha256 "$hash  ItalworkSupport.exe"
          Write-Host "Built RustDesk version: $version"
          Write-Host "SHA-256: $hash"

      - name: Upload Windows executable
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ItalworkSupport-windows-x64
          path: dist/
          if-no-files-found: error
          retention-days: 30

  package-corresponding-source:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout modified OSS source
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          submodules: recursive
          persist-credentials: false

      - name: Package AGPL corresponding source
        shell: bash
        run: |
          archive=/tmp/ItalworkSupport-corresponding-source.tar.gz
          tar \
            --exclude=.git \
            --exclude=target \
            --exclude='flutter/build' \
            -czf "$archive" .
          mv "$archive" .
          sha256sum ItalworkSupport-corresponding-source.tar.gz \
            > ItalworkSupport-corresponding-source.tar.gz.sha256

      - name: Upload corresponding source
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ItalworkSupport-corresponding-source
          path: |
            ItalworkSupport-corresponding-source.tar.gz
            ItalworkSupport-corresponding-source.tar.gz.sha256
          if-no-files-found: error
          retention-days: 30
